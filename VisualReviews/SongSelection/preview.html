#song-skin-review{width:100%;color:var(--foreground);font-family:Arial,sans-serif}
#song-skin-review .sg-controls{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:16px;padding-right:90px}
#song-skin-review .sg-controls label{display:flex;align-items:center;gap:8px}
#song-skin-review .sg-scene{--sg-accent:#ad8aff;--sg-ink:#182136;--sg-muted:#485166;--sg-face:#ebedf4;--sg-face-end:#c6cbd6;--sg-edge:#f7f9ff;--sg-selected:#d4c7ed;position:relative;isolation:isolate;overflow:hidden;container-type:inline-size;background:#dcd4ec center/cover;color:var(--sg-ink);padding:20px 7%;min-height:620px;box-sizing:border-box;transition:background-image .5s,color .45s}
#song-skin-review .sg-scene[data-mode=dark]{--sg-ink:#f4eee0;--sg-muted:#c3c8d5;--sg-face:#202632;--sg-face-end:#303846;--sg-edge:#738093;--sg-selected:#343349;background-color:#10131c}
#song-skin-review .sg-title{font:400 clamp(32px,5.4cqw,62px)/1.12 SongBrush,Arial,sans-serif;letter-spacing:1px;text-align:center;margin:4px 0 18px;color:var(--sg-ink)}
#song-skin-review .sg-list{max-width:820px;margin:auto;display:flex;flex-direction:column;gap:6px}
#song-skin-review .sg-row{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 30px 122px;align-items:stretch;min-height:48px;padding:2px 10px 2px 3px;box-sizing:border-box;background:linear-gradient(110deg,var(--sg-edge),#8996aa 45%,var(--sg-edge));clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
#song-skin-review .sg-row:before{content:&#x27;&#x27;;position:absolute;inset:2px;z-index:-1;background-image:var(--sg-grain),repeating-linear-gradient(132deg,transparent 0 3px,#818aa20b 3px 4px),linear-gradient(112deg,var(--sg-face),var(--sg-face-end));background-size:128px 128px,auto,auto;background-blend-mode:soft-light,normal,normal;clip-path:polygon(11px 0,100% 0,calc(100% - 11px) 100%,0 100%)}
#song-skin-review .sg-row:after{display:none;content:&#x27;&#x27;;position:absolute;inset:5px auto 5px 2%;width:3px;background:var(--sg-accent);opacity:var(--sg-strength,.7);pointer-events:none}
#song-skin-review .sg-row[data-selected=true]{background:var(--sg-accent)}
#song-skin-review .sg-row[data-selected=true]:before{background-image:var(--sg-grain),repeating-linear-gradient(132deg,transparent 0 3px,#818aa20b 3px 4px),linear-gradient(110deg,color-mix(in srgb,var(--sg-accent) 42%,var(--sg-face)),var(--sg-face-end))}
#song-skin-review .sg-row[data-selected=true]:after{width:6px;opacity:1}
#song-skin-review .sg-pick{border:0;background:transparent;color:var(--sg-ink);text-align:left;display:flex;align-items:center;gap:20px;padding:8px 14px 8px 28px;min-width:0;font:500 16px/1.3 Arial,sans-serif}
#song-skin-review .sg-pick[aria-pressed=true]{background:transparent!important;box-shadow:none}
#song-skin-review .sg-number{color:var(--sg-muted);font-size:12px;letter-spacing:1px;font-variant-numeric:tabular-nums;flex-shrink:0}
#song-skin-review .sg-song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#song-skin-review .sg-history{display:flex;align-items:center;justify-content:center;color:var(--sg-muted);opacity:.7}
#song-skin-review .sg-preview{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;min-height:36px;align-self:center;justify-self:stretch;margin:4px 0;border:0;background:color-mix(in srgb,var(--sg-accent) 65%,var(--sg-edge));color:var(--sg-ink);font:500 11px/1 Arial,sans-serif;letter-spacing:1px;padding:8px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
#song-skin-review .sg-preview:before{content:&quot;&quot;;position:absolute;inset:1px;z-index:-1;background-image:var(--sg-grain),linear-gradient(120deg,var(--sg-face),var(--sg-face-end));background-size:128px 128px,auto;background-blend-mode:soft-light,normal;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#song-skin-review .sg-preview[data-playing=true]{color:var(--sg-ink);background:var(--sg-accent)}
#song-skin-review .sg-preview[data-playing=true]:before{background-image:var(--sg-grain),linear-gradient(120deg,color-mix(in srgb,var(--sg-accent) 35%,var(--sg-face)),color-mix(in srgb,var(--sg-accent) 25%,var(--sg-face-end)))}
#song-skin-review .sg-list button:hover{background-color:color-mix(in srgb,var(--sg-accent) 12%,transparent)}
#song-skin-review .sg-import{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px;margin:10px auto 0;width:min(100%,420px);border:1px solid color-mix(in srgb,var(--sg-ink) 30%,transparent);color:var(--sg-ink);background-image:var(--sg-grain),linear-gradient(115deg,color-mix(in srgb,var(--sg-face) 86%,transparent),color-mix(in srgb,var(--sg-face-end) 86%,transparent));background-size:128px 128px,auto;background-blend-mode:soft-light,normal;font:500 13px/1.2 Arial,sans-serif;letter-spacing:2px;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%)}
#song-skin-review .sg-footer{max-width:820px;display:flex;align-items:center;justify-content:space-between;gap:30px;margin:16px auto 0;padding:0 8px}
#song-skin-review .sg-action{position:relative;isolation:isolate;flex:0 1 230px;min-height:48px;border:0;background:transparent;color:#182136;font:500 18px/1.2 Arial,sans-serif;letter-spacing:3px;text-align:center}
#song-skin-review .sg-action:before{content:&#x27;&#x27;;position:absolute;z-index:-1;inset:-33.333% -5.556%;background:var(--sg-button) center/100% 100% no-repeat;pointer-events:none}
#song-skin-review .sg-action.sg-play{color:var(--sg-button-ink,#fff)}
#song-skin-review .sg-action.sg-play:before{background-image:var(--sg-button-active)}
#song-skin-review .sg-action:hover{filter:brightness(1.12)}
#song-skin-review .sg-coming{text-align:center;font:400 11px/1.5 Arial,sans-serif;color:var(--sg-muted);letter-spacing:.5px;margin-top:12px}
#song-skin-review .sg-coming span{display:block;font-size:11px;opacity:.85}
#song-skin-review .sg-status{font:400 12px/1.4 Arial,sans-serif;color:var(--sg-muted);min-height:17px;text-align:center;margin-top:10px}
#song-skin-review .sg-versions{margin-top:20px}
#song-skin-review .sg-versions summary{padding:8px 0}
#song-skin-review .sg-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:12px}
#song-skin-review .sg-thumb{position:relative;min-width:0;border:0;background:none;color:var(--foreground);text-align:left;padding:0;font:400 13px/1.3 Arial,sans-serif}
#song-skin-review .sg-thumb-art{position:relative;display:block;aspect-ratio:16/9;background-position:center;background-size:cover;overflow:hidden;padding:13% 15%;box-sizing:border-box;outline-offset:3px}
#song-skin-review .sg-thumb[aria-pressed=true] .sg-thumb-art{outline:2px solid var(--sg-swatch)}
#song-skin-review .sg-thumb-lines{height:100%;display:flex;flex-direction:column;gap:8%}
#song-skin-review .sg-thumb-lines b{display:block;flex:1;background:linear-gradient(110deg,#edf0f7,#c0c7d6);border-left:3px solid var(--sg-swatch);transform:skew(-9deg)}
#song-skin-review .sg-thumb-lines b:nth-child(2){background:color-mix(in srgb,var(--sg-swatch) 65%,#edf0f7)}
#song-skin-review .sg-thumb-label{display:block;margin-top:6px}
#song-skin-review .sg-status:empty{display:none}
#song-skin-review svg{flex-shrink:0}
#song-skin-review .sg-row{min-height:56px;padding:4px 36px 4px 12px;background:transparent;clip-path:none}
#song-skin-review .sg-row[data-selected=true]{background:transparent}
#song-skin-review .sg-row:before,#song-skin-review .sg-row[data-selected=true]:before{inset:0;z-index:-2;background:var(--sg-row-plate) center/100% 100% no-repeat;clip-path:none}
#song-skin-review .sg-row:after{content:&#x27;&#x27;;display:block;position:absolute;inset:0;width:auto;z-index:-1;pointer-events:none;background:var(--sg-accent);mask-image:var(--sg-row-plate);mask-size:100% 100%;mask-repeat:no-repeat;mix-blend-mode:multiply;opacity:0}
#song-skin-review .sg-row[data-selected=true]:after{display:none}
#song-skin-review .sg-row[data-selected=true]:before{background-image:var(--sg-row-selected-plate)}
#song-skin-review .sg-row:after{display:none!important}
#song-skin-review .sg-row[data-selected=true] .sg-pick,#song-skin-review .sg-row[data-selected=true] .sg-number,#song-skin-review .sg-row[data-selected=true] .sg-history{color:var(--sg-row-selected-ink,#fff)}
#song-skin-review .sg-pick{color:#172033;padding-left:30px;gap:16px}
#song-skin-review .sg-number,#song-skin-review .sg-history{color:#3c4658}
#song-skin-review .sg-preview{color:#172033;border:0;border-left:1px solid #25304426;background:linear-gradient(115deg,#f7f8fbd0,#e3e7edbb);letter-spacing:1px;min-height:32px;margin:4px 0}
#song-skin-review .sg-preview:before,#song-skin-review .sg-preview[data-playing=true]:before{display:none}
#song-skin-review .sg-preview[data-playing=true]{color:#172033;background:color-mix(in srgb,var(--sg-accent) 25%,#edf0f5)}
#song-skin-review .sg-thumb-lines b{background:var(--sg-row-plate) center/100% 100% no-repeat;border:0;transform:none}
#song-skin-review .sg-thumb-lines b:nth-child(2){background-image:var(--sg-row-plate);background-color:var(--sg-swatch);background-blend-mode:multiply}
#song-skin-review button:focus-visible{outline:2px solid var(--sg-accent);outline-offset:3px}
@media(max-width:650px){#song-skin-review .sg-controls{padding-right:0;gap:10px}#song-skin-review .sg-scene{padding:24px 16px;min-height:670px}#song-skin-review .sg-title{font-size:36px;margin-bottom:24px}#song-skin-review .sg-row{grid-template-columns:1fr 24px 84px;min-height:64px;padding-right:24px}#song-skin-review .sg-pick{font-size:14px;gap:9px;padding-left:17px;padding-right:3px}#song-skin-review .sg-song{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}#song-skin-review .sg-preview{padding:7px;min-height:44px}#song-skin-review .sg-preview .sg-preview-word{display:inline}#song-skin-review .sg-footer{gap:26px}#song-skin-review .sg-action{font-size:15px;min-height:42px}#song-skin-review .sg-coming{margin-top:20px}#song-skin-review .sg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){#song-skin-review *{transition:none!important}}

    "visualization-share-root",

  let sizeFingerprint = null;

    globalThis.location.pathname,
    globalThis.location.search,

  const sizeStorageKey = `${storageKey}:share-size-v1`;

      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024

      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",

      state == null ||
      typeof state !== "object" ||

        typeof prompt !== "string" ||

  if (srcdoc == null) {

  globalThis.addEventListener("resize", () => {

    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {

    channel.port1.postMessage({ type: "measure" });

  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );

  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;

      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");

        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===

    }

  delete frame.dataset.srcdoc;
